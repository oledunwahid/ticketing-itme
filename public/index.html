<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>IT-ME Ticketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Boot loader -->
  <div id="app-loading" class="app-loading-screen">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <!-- AUTH (login / register) -->
  <div id="auth-root" class="auth-root" hidden></div>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-shell" hidden>
    <!-- Mobile drawer overlay -->
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">IM</div>
        <span class="brand-text">IT-ME<span class="brand-sub">Ticketing</span></span>
        <button id="drawer-close" class="drawer-close" aria-label="Close menu">&times;</button>
      </div>
      <nav id="nav-menu" class="nav-menu"><!-- rendered by JS --></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">?</div>
          <div class="user-meta">
            <span class="user-name" id="user-name">…</span>
            <span class="user-role" id="user-role">…</span>
          </div>
        </div>
        <button id="btn-change-password" class="btn-outline btn-change-pw" style="width:100%;margin-top:6px;justify-content:center;font-size:12px">🔑 Change Password</button>
        <button id="btn-logout" class="btn-primary btn-logout">Sign out</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button id="btn-hamburger" class="icon-btn hamburger" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <button id="btn-theme" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
          </button>
          <button id="btn-report-quick" class="btn-primary btn-report">＋ Report Issue</button>
        </div>
      </header>

      <main id="app-view" class="app-view"><!-- views rendered by JS --></main>

      <!-- Mobile bottom nav -->
      <nav id="bottom-nav" class="bottom-nav"><!-- rendered by JS --></nav>
    </div>
  </div>

  <!-- Modal + toast roots -->
  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
